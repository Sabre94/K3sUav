apiVersion: v1
kind: Pod
metadata:
  name: test-nginx-scheduled
  namespace: default
  labels:
    app: test-nginx
spec:
  schedulerName: uav-scheduler  # 使用 UAV 调度器
  containers:
  - name: nginx
    image: nginx:alpine
    ports:
    - containerPort: 80
    resources:
      requests:
        cpu: 100m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
  restartPolicy: Always
