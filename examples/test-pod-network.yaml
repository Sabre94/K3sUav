---
# 示例 4: 使用 network-latency 算法的 Pod
# 这个 Pod 会被调度到网络延迟最低的节点
apiVersion: v1
kind: Pod
metadata:
  name: realtime-app
  namespace: default
  annotations:
    # 指定使用基于网络延迟的调度算法
    uav.scheduler/algorithm: "network-latency"

    # 要求节点网络延迟不超过 100ms
    uav.scheduler/max-latency: "100.0"
spec:
  # 使用 UAV 自定义调度器
  schedulerName: uav-scheduler

  containers:
  - name: app
    image: nginx:latest
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

  restartPolicy: Always
